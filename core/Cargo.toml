[package]
name = "totp_core"
version = "2.0.0"
edition = "2024"

[lib]
name = "totp_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 体积优先：panic 跨 FFI 直接终止进程，取舍见 design.md 决定 12
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
